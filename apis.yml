apis:
- name: Identity Platform Tenant Management API
  description: >-
    The Tenant Management API enables developers to create and manage tenants for multi-tenant Identity
    Platform configurations. Each tenant can have its own set of identity providers, authentication settings,
    and user pools, allowing SaaS applications to isolate authentication for different customers or organizational
    units.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cloud.google.com/identity-platform/docs/multi-tenancy
  baseURL: https://identitytoolkit.googleapis.com
  tags:
  - Multi-Tenancy
  - Software-as-a-Service
  - Tenant Management
  tags_raw:
  - Multi-Tenancy
  - SaaS
  - Tenant Management
  properties:
  - type: Documentation
    url: https://cloud.google.com/identity-platform/docs/multi-tenancy
- name: Identity Platform OAuth Configuration API
  description: >-
    The OAuth Configuration API allows developers to programmatically manage OAuth identity provider configurations
    for Identity Platform projects. It supports configuring Google, Facebook, Apple, Microsoft, Twitter,
    GitHub, and other OIDC and SAML providers for federated authentication.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cloud.google.com/identity-platform/docs/federated-login
  baseURL: https://identitytoolkit.googleapis.com
