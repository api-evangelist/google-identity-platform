specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Identity Platform
providerId: google-identity-platform
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Authentication
  - Google Cloud
  - Identity
  - Multi-Tenancy
  - OAuth
description: Google Identity Platform pricing follows the Firebase Authentication / Google Cloud model — a generous
  no-cost tier for Monthly Active Users (MAUs) plus pay-as-you-go beyond the free quota. SAML/OIDC providers and
  phone/SMS authentication have separate metered prices. Pricing is per-MAU with regional variation; SMS pricing
  varies by destination country.
sources:
  - https://cloud.google.com/identity-platform/pricing
  - https://firebase.google.com/pricing
plans:
  - id: google-identity-platform-no-cost
    name: No-Cost (Spark)
    type: freemium
    description: Free tier covering up to 50,000 monthly active users (MAUs) with standard authentication
      (email/password, federated providers). Phone/SMS auth not included.
    entries:
      - label: Monthly active users (standard)
        name: mau_standard
        type: quota
        metric: mau
        limit: 50000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
      - label: Monthly active users (SAML/OIDC)
        name: mau_saml_oidc
        type: quota
        metric: mau
        limit: 50
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
    elements:
      - name: Email/password authentication
      - name: Federated identity (Google, Facebook, Apple, Microsoft, Twitter, GitHub)
      - name: Anonymous authentication
      - name: Custom token authentication
      - name: Identity Toolkit API
      - name: Identity Platform Tenant Management API
      - name: Identity Platform OAuth Configuration API
  - id: google-identity-platform-pay-as-you-go
    name: Pay As You Go (Blaze)
    type: usage-based
    description: Beyond the no-cost tier, MAUs and SMS verification are metered per-use. Standard MAU pricing tiers
      reduce per-user cost at higher volume; SMS prices vary by destination country.
    entries:
      - label: Standard MAU (50K-100K range)
        name: mau_standard_tier1
        type: metered
        metric: mau
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.0055'
        userMultiplied: true
      - label: SAML / OIDC MAU
        name: mau_saml_oidc_metered
        type: metered
        metric: mau
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.015'
        userMultiplied: true
      - label: Phone authentication (SMS)
        name: phone_auth_sms
        type: metered
        metric: sms
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see vendor pricing calculator
        userMultiplied: false
    elements:
      - name: All No-Cost tier features
      - name: SAML 2.0 federation
      - name: OIDC federation
      - name: Phone / SMS multi-factor authentication
      - name: Multi-tenancy
      - name: Volume-discounted MAU pricing
      - name: Google Cloud SLA
  - id: google-identity-platform-enterprise
    name: Enterprise / Negotiated
    type: enterprise
    description: Negotiated pricing for high-volume customers via Google Cloud sales. Includes committed-use
      discounts, custom data residency, and dedicated support.
    entries:
      - label: Custom committed MAU rate
        name: custom_mau
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: true
    elements:
      - name: Custom committed-use discounts
      - name: Data residency options
      - name: Enterprise support
      - name: Technical Account Manager
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
