meters:
  - name: monthly_active_users_standard
    description: MAUs authenticated via standard providers (email/password, social, anonymous, custom)
    unit: mau
    aggregation: max
    dimensions:
      - tenant
      - provider
      - region
  - name: monthly_active_users_saml_oidc
    description: MAUs authenticated via SAML or OIDC enterprise providers
    unit: mau
    aggregation: max
    dimensions:
      - tenant
      - provider
      - region
  - name: phone_auth_verifications
    description: SMS phone-auth verification messages sent
    unit: sms
    aggregation: sum
    dimensions:
      - destination_country
      - tenant
principles:
  - name: Visibility
    description: Use Google Cloud Billing exports to BigQuery and the Identity Platform usage dashboard
      to track MAU and SMS spend per project.
  - name: Allocation
    description: Tag Google Cloud projects and Identity Platform tenants with team / environment labels
      so MAU and SMS charges roll up per consuming team.
  - name: Optimization
    description: Move suitable workloads under the 50K-MAU no-cost tier; consolidate sandbox tenants into
      shared projects; restrict SMS auth to high-risk geographies and prefer TOTP for low-risk users.
  - name: Accountability
    description: Set Cloud Billing budgets and anomaly alerts on the Identity Platform SKU; review
      monthly MAU growth against forecast.
